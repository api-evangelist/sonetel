name: Sonetel MCP Server (candidate)
type: MCPServer
generated: '2026-10-09'
method: derived
source: openapi/ (18 Sonetel OpenAPI files from github.com/Sonetel/sonetel-api-docs)
status: candidate
description: No official Sonetel MCP server was found. A web search for a Sonetel MCP server returned nothing naming
  Sonetel. The Sonetel GitHub org (15 repos) has no MCP repository. https://sonetel.com/.well-known/mcp.json returned
  404 and mcp.sonetel.com did not resolve. https://api.sonetel.com/mcp returned 401, but so does a nonsense path
  (https://api.sonetel.com/zzz-nonexistent-9183 -> 401, same sonetel_native error body), so that 401 tells us nothing
  about an MCP server. The tools below are a CANDIDATE list derived 1:1 from the OpenAPI operationIds. Nobody ships
  them.
deployment:
  mode: none
  auth: unknown
  verified: derived
evidence:
- url: https://sonetel.com/.well-known/mcp.json
  status: 404
- url: https://mcp.sonetel.com/
  status: no response (DNS/connect failure)
- url: https://api.sonetel.com/mcp
  status: 401
  note: catch-all gateway 401; control path also 401
- url: https://api.github.com/orgs/Sonetel/repos
  status: 200
  note: no MCP repository
transport_if_built: would call https://public-api.sonetel.com with a bearer token from POST https://api.sonetel.com/SonetelAuth/beta/oauth/token
