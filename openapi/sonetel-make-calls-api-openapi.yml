          schema:
            type: object
            properties:
              error:
                type: string
                description: The type of error
              error_description:
                type: string
                description: Details of the error
            x-examples:
              example-1:
                error: invalid_token
                error_description: 'Access token expired: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..P-6GqNJOW7qZYavq7rlSU_LzpKd-xjCqi2JEncn-9Vzm9D3ZCcQgsUmkWNJEsfPlFZl7YLJvkXt7JzaqUCdgEr6VfL69EhxPYrQ1Vyrx3pgPBPcJVCENZqja4-3N-mLSaua7C2KXhakYb01kT6NyJ0f0i8_0XwPQQKZPRonPP2Qa8plUmShrCcTzU_vxkWQTSEbxtTlYB5gIpnrgXbG0EWb0YOMIhqT8NSF7FSR_uJ5GFvy1KqYtL4OGwccy63gU66Or-C5331UDwGGVCiw4z49Me699PsKygngh4LaT3BpuqA8oE77xYiCVUJ8j2vNz36Qw58GLmJFSURAIAynpxw'
    insufficient-balance:
      description: Example response
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                description: The status code of the response
              response:
                type: object
                description: The respone object
                properties:
                  response:
                    type: string
                    description: Text describing the error message
            x-examples:
              example-1:
                statusCode: 403
                response:
                  session_id: string
  parameters:
    Authorization:
      name: Authorization
      in: header
      description: The authorization header contains your access token and is used to authenticate requests. Generate an `access_token` using the `/oauth/token` endpoint.
      required: true
      schema:
        type: string
        examples:
        - Bearer <ACCESS_TOKEN>
    Content-Type:
      name: Content-Type
      in: header
      description: The content type of the request
      required: false
      schema:
        type: string
        default: application/json
    Accept:
      name: Accept
      in: header
      description: The content type that should be returned in the response.
      required: true
      schema:
        type: string
        default: application/json
  requestBodies:
    callback:
      description: Send a callback request to Sonetel.
      content:
        application/json:
          schema:
            type: object
            properties:
              app_id:
                type: string
                description: An ID for your client. This can be any string.
              call1:
                type: string
                description: Your number or address that we will call first
              call2:
                type: string
                description: The number or address you wish to call.
              show_1:
                type: string
                description: The caller ID that should be shown to you when you answer `call1`.
              show_2:
                type: string
                description: The caller ID that should be shown to the person you are calling.
            x-examples:
              example-1:
                app_id: your_app_name_or_id
                call1: '+12025550000'
                call2: '+14045551111'
                show_1: automatic
                show_2: automatic
          examples:
            Callback Example:
              value:
                app_id: acme_nodejs_app_v2.1
                call1: john.doe@example.com
                call2: '+12025551234'
                show_1: automatic
                show_2: '+19175551234'
  securitySchemes:
    Production:
      type: oauth2
      flows:
        password:
          refreshUrl: https://api.sonetel.com/SonetelAuth/beta/oauth/token
          tokenUrl: https://api.sonetel.com/SonetelAuth/beta/oauth/token
          scopes: {}
