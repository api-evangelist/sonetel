openapi: 3.2.0
info:
  title: Sonetel Account API
  version: '2.0'
  termsOfService: https://sonetel.com/en/help/help-topics/terms-conditions/terms-conditions/
  description: 'Operations tagged Account across 8 of this provider''s published API definitions: 5_voice_apps.yaml, 7_users.yaml, account.yaml, phone_numbers.yaml, sonetel-account-openapi.yml, sonetel-phone-numbers-openapi.yml, sonetel-users-openapi.yml, sonetel-voice-apps-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://public-api.sonetel.com
  description: Production
- url: https://public-api.sonetel.com/
  description: Production
tags:
- name: Account
paths:
  /account/{accountid}/voiceapp:
    get:
      summary: Get all voice apps
      description: '# Get all voice apps


        Issue a GET request to `/account/{accountid}/voiceapp` to fetch a list of all the voice apps in your account.


        The response contains the properties of all the voice apps in your account including their unique `app_id`.'
      operationId: get-voiceapps-account
      parameters:
      - name: Authorization
        in: header
        description: Bearer <access_token>
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/List-voiceapps'
        '401':
          description: Unauthorized
      security:
      - Production: []
      servers:
      - url: https://public-api.sonetel.com
        description: Production
      tags:
      - Account
    post:
      summary: Create new voice app
      description: '# Create new voice app


        In addition to the default voice apps available in your Sonetel account, you can create new voice apps as well by issuing a POST request to the voice app list resource i.e. `POST https://public-api.sonetel.com/account/{accountid}/voiceapp`.


        The body of the request must contain a JSON representation of the app''s properties such as its name and type. These are described in details below.


        The response to a successful request carries the resource representation of the newly created voice app.'
      operationId: create-voiceapp-account
      parameters:
      - name: Authorization
        in: header
        description: Bearer <access_token>
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: application/json
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Voiceapp'
      responses:
        '200':
          $ref: '#/components/responses/Voiceapp-response'
      security:
      - Production: []
      servers:
      - url: https://public-api.sonetel.com
        description: Production
      tags:
      - Account
    servers:
    - url: https://public-api.sonetel.com
      description: Production
  /account/{accountid}/voiceapp/{voiceappid}:
    get:
      summary: Get voice app by ID
      description: '# Get voice app by ID


        Get the properties of a specific voice app using its unique `app_id` i.e. `GET https://public-api.sonetel.com/account/{accountid}/voiceapp/{voiceappid}`.


        The response contains a JSON representation of the app''s properties. The properties in the response will vary based on the type of voice app.


        #### Get the app_id


        To get the `app_id` of a specific voice app, issue a GET request to `/account/{accountid}/voiceapp`.


        This will return a list of all the voice apps in your Sonetel account.'
      operationId: get-account-voiceappid
      parameters:
      - name: Authorization
        in: header
        description: Bearer <access_token>
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      - name: voiceappid
        in: path
        description: The unique ID of the voice app you wish to manage.
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Voiceapp-response'
      security:
      - Production: []
      servers:
      - url: https://public-api.sonetel.com
        description: Production
      tags:
      - Account
    put:
      summary: Update voice app by ID
      description: '# Update voice app by ID


        Voice apps can be updated by issuing a PUT to the `/voiceapp` resource. For example, `PUT https://public-api.sonetel.com/account/{accountid}/voiceapp/{voiceappid}`.


        The voice app''s name, voice, actions, etc can be updated. A list of the properties that can be updated is given below.


        > Not all the properties are available in the all the voice apps. Some of them will only be available in specific apps such as `sysprompt` or `mailbox` - this is mentioned in the property''s description.


        A successful response will return the updated resource.'
      operationId: update-account-voiceappid
      parameters:
      - name: Authorization
        in: header
        description: Bearer <access_token>
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: application/json
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      - name: voiceappid
        in: path
        description: The unique ID of the voice app you wish to manage.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Voiceapp'
      responses:
        '200':
          $ref: '#/components/responses/Voiceapp-response'
      security:
      - Production: []
      servers:
      - url: https://public-api.sonetel.com
        description: Production
      tags:
      - Account
    delete:
      summary: Delete a voice app
      description: '# Delete a voice app


        Voice apps can be deleted by issuing a DELETE to the `/voiceapp` resource i.e. `DELETE https://public-api.sonetel.com/account/{accountid}/voiceapp/{voiceappid}`


        > Deleting a voice app is permanent. It is not possible to restore voice apps once they are deleted.'
      operationId: delete-account-voiceappid
      parameters:
      - name: Authorization
        in: header
        description: Bearer <access_token>
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      - name: voiceappid
        in: path
        description: The unique ID of the voice app you wish to manage.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                    description: Name of the resource accessed. For example `voiceapp`.
                    readOnly: true
                  status:
                    type: string
                    enum:
                    - success
                    - failed
                    description: Status of the request i.e. success or failed.
                    readOnly: true
                  response:
                    type: string
                    description: Details of the response.
                    readOnly: true
                x-examples:
                  example-1:
                    resource: voiceapp
                    status: success
                    response: Voice App deleted successfully
              examples:
                Example:
                  value:
                    resource: voiceapp
                    status: success
                    response: Voice App deleted successfully
      security:
      - Production: []
      servers:
      - url: https://public-api.sonetel.com
        description: Production
      tags:
      - Account
    servers:
    - url: https://public-api.sonetel.com
      description: Production
  /account/{accountid}/voiceapp/{voiceappid}/prompt:
    post:
      summary: Create a custom prompt
      description: '# Create a custom prompt


        You can create one or more custom prompts under a voice app. A custom prompt is a short message that you want your callers to hear under certain conditions.


        For example, if you frequently run sales and promotional offers, you can add a custom prompt for this. The voice message linked to this custom prompt can then be updated whenever you have a new promo or when an ongoing promo ends.


        When creating the prompt, you can only specify its name. The voice message linked to it can only be added after the prompt has beens successfully created.


        The voice message associated with a prompt can be setup in different ways. You can upload an audio file with the voice message, record the voice message by calling in to our recording service or use our paid text-to-speech service.


        Creating a prompt and associating a voice message with it is a as a two-step process:


        1. The first step involves creation of the prompt resource. This is done by issuing a POST to the prompt resource. The prompt''s name must be specified as a parameter in the request.

        At this stage, the prompt does not have any voice message associated to it and is not usable in the voice app.

        2. To attach a voice message to the prompt, you can either upload a pre-recorded wav file or dial *22 from your Sonetel account, enter the `record_id` of the prompt and record it.


        ### Flow for creating a new prompt


        Here is a sample flow where we create a new custom prompt and upload a pre-recorded audio file to it.


        #### Step 1 - create prompt


        ```c

        curl \

        --location \

        --request POST ''https://public-api.sonetel.com/account/{accountid}/voiceapp/{voiceappid}/prompt?name=Christmas Promo'' \

        --header ''Authorization: Bearer ''

        ```


        > A success response will return the JSON representation of the newly created prompt. Make a note of the `prompt_id` for use in step 2.


        #### Step 2 - upload voice message


        ```c

        curl \

        --location \

        --request POST ''https://public-api.sonetel.com/prompt/{promptid}/message'' \

        --header ''Accept: application/json, text/plain, */*'' \

        --header ''Authorization: Bearer '' \

        --header ''Content-Type: multipart/form-data; boundary={boundary_id}''

        --form ''file=@"{/path/to/file}"''

        ```

        An alternative to uploading a pre-recorded message is recording your own message by calling in via SIP. Place a SIP call to the prompt''s `record_path` (which is just a SIP address), record your message and press # once done.


        Similarly, to listen to the recording, call the prompt''s `play_path`.'
      operationId: post-user
      parameters:
      - name: Authorization
        in: header
        description: Bearer <access_token>
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: application/json
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      - name: voiceappid
        in: path
        description: The unique ID of the voice app you wish to manage
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create-Prompt'
      responses:
        '200':
          $ref: '#/components/responses/List-prompt'
      security:
      - Production: []
      servers:
      - url: https://public-api.sonetel.com
        description: Production
      tags:
      - Account
    get:
      summary: List prompts linked to voice app
      description: '# List prompts linked to voice app


        A prompt represents a voice message in a voice app such as the welcome message in an IVR.


        Use this endpoint to get a list of all the prompts associated with a voice app as shown in the example below.


        Request:

        ```c

        curl \

        --location \

        --request GET ''https://public-api.sonetel.com/account/{accountid}/voiceapp/{voiceappid}/prompt?fields=message'' \

        --header ''Authorization: Bearer ''

        ```


        Response:

        ```json

        {

        "resource": "prompt",

        "status": "success",

        "response": [

        {

        "prompt_id": "PRio9aaaaaaa",

        "type": "standard",

        "name": "Welcome",

        "app_id": "VA9azaabbcc",

        "account_id": "20000000",

        "record_id": "7001",

        "exists": true,

        "file_name": "response.wav",

        "file_details": "Uploaded",

        "play_path": "play#PRio9aaaaaaa@prompts.sonetel.com",

        "record_path": "record#PRio9aaaaaaa@prompts.sonetel.com",

        "audio_length": "10.0",

        "size": "157.92",

        "message_url": "https://audio-prompts.sonetel.com/PRio9aaaaaaa-00000000-aaaa-0000-a000-0a0aa00a000a.wav",

        "create_date": "20210727T00:00:00Z"

        },

        {

        "prompt_id": "PRio9aaaaaa4",

        "type": "standard",

        "name": "Please wait",

        "app_id": "VA9zzxxyyaa",

        "account_id": "20000000",

        "record_id": "7008",

        "exists": true,

        "file_name": "",

        "play_path": "play#PRio9aaaaaa4@prompts.sonetel.com",

        "record_path": "record#PRio9aaaaaa4@prompts.sonetel.com",

        "audio_length": "2",

        "size": "",

        "message_url": "https://audio-prompts.sonetel.com/standard/en/sonetel/please_wait.wav",

        "create_date": ""

        }

        ]

        }

        ```'
      operationId: get-user
      parameters:
      - name: Authorization
        in: header
        description: Bearer <access_token>
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      - name: voiceappid
        in: path
        description: The unique ID of the voice app you wish to manage
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/List-prompt'
      security:
      - Production: []
      servers:
      - url: https://public-api.sonetel.com
        description: Production
      tags:
      - Account
    servers:
    - url: https://public-api.sonetel.com
      description: Production
  /account/{accountid}/voiceapp/{voiceappid}/prompt/{promptid}:
    get:
      summary: Get prompts by ID
      description: '# Get prompts by ID


        Use this endpoint to get the details of a specific prompt using its `prompt_id`.


        To get a list of all the prompts associated with a voice app, issue a GET request to `/account/{accountid}/voiceapp/{voiceappid}/prompt`. The response returns a JSON representation of all the prompts with their properties.


        ### Prompt message details


        In order to fetch the details of the voice message linked to the prompt, add the query parameters `?fields=message` to the GET request.


        Example:


        ```c

        curl \

        --location --request GET \

        ''https://public-api.sonetel.com/account/{accountid}/voiceapp/{voiceappid}/prompt/{promptid}?fields=message'' \

        --header ''Content-Type: application/json'' \

        --header ''Authorization: Bearer ''

        ```'
      operationId: get-voiceapp-prompt-id
      parameters:
      - name: Authorization
        in: header
        description: Bearer <access_token>
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Include the message details in the response by adding this query parameter to the API call.
        schema:
          type: string
          default: message
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      - name: voiceappid
        in: path
        description: Unique ID of the voice app you wish to manage
        required: true
        schema:
          type: string
      - name: promptid
        in: path
        description: Unique ID of the voice prompt you wish to manage
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/List-prompt'
        '404':
          description: Not Found
      security:
      - Production: []
      servers:
      - url: https://public-api.sonetel.com
        description: Production
      tags:
      - Account
    put:
      summary: Update prompt by ID
      description: 'Update the prompt by issuing a PUT request to the `/prompt/{promptid}` endpoint.


        At the moment, it is only possible to update the name of a prompt.


        > The voice message played by the prompt can be updated by issuing a POST request to the `/prompt/{promptid}/message` endpoint. This is described in detail in the section **Add custom message to a prompt**.'
      operationId: Replace-voiceapp-promptid
      parameters:
      - name: Authorization
        in: header
        description: Bearer <access_token>
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      - name: voiceappid
        in: path
        description: Unique ID of the voice app you wish to manage
        required: true
        schema:
          type: string
      - name: promptid
        in: path
        description: Unique ID of the voice prompt you wish to manage
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      security:
      - Production: []
      servers:
      - url: https://public-api.sonetel.com
        description: Production
      tags:
      - Account
    delete:
      summary: Delete a custom prompt
      description: '# Delete a custom prompt


        Prompts that you have created, i.e. custom prompts can be deleted by issuing a DELETE to the prompt resource, either using the full URL or the short URL.


        To delete using the full path URL use:

        `DELETE https://public-api.sonetel.com/account/{accountid}/voiceapp/{voiceappid}/prompt/{promptid}`


        Response to a successful method call carries a string with confirmation.


        > It is not possible to delete the default prompts added to the voice app automatically when it is created.'
      operationId: delete-voiceapp-promptid
      parameters:
      - name: Authorization
        in: header
        description: Bearer <access_token>
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      - name: voiceappid
        in: path
        description: Unique ID of the voice app you wish to manage
        required: true
        schema:
          type: string
      - name: promptid
        in: path
        description: Unique ID of the voice prompt you wish to manage
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                    description: Name of the resource accessed i.e. prompt
                    minLength: 1
                  status:
                    type: string
                    description: Status of the request i.e. success or failed
                    minLength: 1
                  response:
                    type: string
                    description: Details of the response.
                    minLength: 1
                x-examples:
                  example-1:
                    resource: prompt
                    status: success
                    response: Prompt deleted successfully
              examples:
                Example:
                  value:
                    resource: prompt
                    status: success
                    response: Prompt deleted successfully
      security:
      - Production: []
      servers:
      - url: https://public-api.sonetel.com
        description: Production
      tags:
      - Account
    servers:
    - url: https://public-api.sonetel.com
      description: Production
  /account/{accountid}/user:
    post:
      summary: Add new user
      description: '# Add new user


        Add a new user to your account by issuing a POST request to the `/user` endpoint.


        You must include the user''s details such as their first and last names, password and email address in order to successfully create their account.


        > The user''s email address must be a unique i.e. not in use by any other user in our system.


        You can optionally include the `"type" : "admin"` property as well if you wish to add a new admin user.


        ### User settings


        Some of the user''s preferences can be set while creating the account. For example, you can set the user''s call settings or their location.'
      operationId: postAccountByAccountidUser
      parameters:
      - name: Content-Type
        in: header
        description: application/json
        required: true
        schema:
          type: string
          default: application/json
      - name: Authorization
        in: header
        description: Bearer <access_token>
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID.
        required: true
        schema:
          type: number
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User-Update'
            examples:
              Add regular user:
                value:
                  user_fname: Jane
                  user_lname: Doe
                  email: user1@example.com
                  password: pa$$word
                  location:
                    country: USA
                    area_code: '212'
              Add admin user:
                value:
                  user_fname: John
                  user_lname: Doe
                  email: user2@example.com
                  password: pa$$word
                  type: admin
      responses:
        '200':
          description: User Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User-GET'
        '400':
          description: Missing Required Information
        '409':
          description: Email Already Taken
      security:
      - Production: []
      servers:
      - url: https://public-api.sonetel.com
        description: Production
      tags:
      - Account
      x-operation-id-source: normalized
      x-operation-id-original: post-user
    get:
      summary: List all users
      description: '# List all users


        Use this endpoint to either get a list of all the users present in your account or search for a specific user.


        ## List all users


        To get a list of all users, issue a GET request to `/account/{accountid}/user`. The response contains a list of all the users along with their details such as their unique user id, email address, created date and so on.


        ## Search for a user


        To search for a specific user, add one of the query parameters listed below. For example, to search for a user whose email address contains the word ''manager'' use `/account/{accountid}/user?email=manager`'
      operationId: getaccount-accountid-user
      parameters:
      - name: Authorization
        in: header
        description: Bearer <access_token>
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: Name of the user you want to search for. Entering the partial name will return all the users with matching names.
        schema:
          type: string
      - name: email
        in: query
        description: Email address of the user you want to search for. Entering a partial email address will return all the users with matching emails.
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID.
        required: true
        schema:
          type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: {}
                  status:
                    type: string
                    description: Status of the request
                    minLength: 1
                  response:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                      type: object
                      properties:
                        user_fname:
                          type: string
                          description: The first name of the user
                          minLength: 1
                        max_conversations:
                          type: number
                          description: The maximum number of customer conversations the user can handle simultaneously
                        language:
                          type: string
                          description: Three letter ISO code of the user's account language.
                          minLength: 1
                        language_id:
                          type: number
                          description: An internal numeric code of the user's account language.
                        title:
                          type: string
                          description: The user's job title for example, Sales Engineer, CEO, etc.
                          minLength: 1
                        type:
                          type: string
                          description: Privilege level of user i.e. admin or regular
                          minLength: 1
                        user_lname:
                          type: string
                          description: The last name of the user.
                          minLength: 1
                        tags:
                          type: string
                          description: Internal identifier used by Sonetel.
                          minLength: 1
                        password_status:
                          type: string
                          description: 'A user’s access via password may be blocked if there are many attempts to use an incorrect password, either while signing in to the web portal or while connecting a SIP phone. This field indicates the current status of the password. This can take the following values.


                            - `ok`: Indicates that access via password is OK.

                            - `1` or `2`: There has been one(1) or two(2) attempts to connect with an incorrect password.

                            - `locked`: The password is locked out and must be reset.'
                          minLength: 1
                        account_id:
                          type: string
                          description: The Sonetel account ID of the account that the user is linked to.
                          minLength: 1
                        user_jid:
                          type: string
                          description: The User’s Jabber Id.
                          minLength: 1
                        sonetel-id:
                          type: string
                          description: A unique identifier for the user used by Jabber.
                          minLength: 1
                        user_id:
                          type: string
                          description: Unique Id of the Sonetel user.
                          minLength: 1
                        company_name:
                          type: string
                          description: Name of the company the user is linked to.
                          minLength: 1
                        created_date:
                          type: string
                          description: The date & time when the user's account was created.
                          minLength: 1
                        email:
                          type: string
                          description: The user's email address.
                          minLength: 1
                        notifications:
                          type: number
                          description: Number of unread notifications for the user.
                x-examples:
                  example-1:
                    resource: null
                    status: success
                    response:
                    - user_fname: John
                      max_conversations: 3
                      language: eng
                      auto_translate: false
                      language_id: 41
                      title: Sales Manager
                      type: regular
                      user_lname: Doe
                      tags: conversations
                      password_status: OK
                      account_id: '2000000'
                      user_jid: 59f9c80c-aaaa-1111-bbbb-cccc3333dddd@eu01.sonetel.com
                      sonetel-id: 59f9c80c-aaaa-1111-bbbb-cccc3333dddd@sonetel.com
                      user_id: '2016383950'
                      company_name: Acme Inc
                      created_date: 20210716T00:00:00Z
                      email: user@example.com
                      notifications: 0
                    - user_fname: John
                      max_conversations: 3
                      language: eng
                      auto_translate: false
                      language_id: 41
