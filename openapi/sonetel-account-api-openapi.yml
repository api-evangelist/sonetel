    post:
      summary: Buy a number
      description: '# Buy a number


        A phone number subscription is created when a phone number is assigned to your Sonetel account.


        To purchase a new number, issue a POST to the `/account/{accountid}/phonenumbersubscription` resource and mention the phone number in the body in the `phnum` field.


        > If you do not specify the `connect_to` and `connect_to_type` properties while purchasing the number, it will not be connected to any destination by default and incoming calls to it will not work.


        The charges for the phone number are debited from your Sonetel prepaid account when the number is successfully assigned to you. You can add credit to your prepaid account from app.sonetel.com.


        > Use the `/account` endpoint to check whether you have enough prepaid credit to purchase the phone number.


        To find a phone number that you want to buy, you can use `/numberstocksummary` and `/availablephonenumber` resources.


        The response carries the phone number subscription resource.'
      operationId: postaccount-accountid-phonenumbersubscription
      parameters:
      - name: Content-Type
        in: header
        description: application/json
        required: true
        schema:
          type: string
          default: application/json
      - name: Authorization
        in: header
        description: Bearer <ACCESS_TOKEN>
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                phnum:
                  type: string
                  description: The phone number that you want to purchase.
                connect_to_type:
                  type: string
                  enum:
                  - user
                  - phnum
                  - sip
                  - app
                  description: The type of destination that the phone number is connected to for receiving incoming calls.
                connect_to:
                  type: string
                  description: The object that the phone number is connected to. It can be a userId, a phone number or a SIP address.
              required:
              - phnum
            examples:
              Example (buy):
                value:
                  phnum: '12025551234'
              Example (buy & connect to SIP):
                value:
                  phnum: '12025551234'
                  connect_to_type: sip
                  connect_to: 12025551234@264.12.345.34:13410
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Single-phone-number-subscription'
        '401':
          description: Unauthorized
      servers:
      - url: https://public-api.sonetel.com/
        description: Production
      tags:
      - Account
    servers:
    - url: https://public-api.sonetel.com/
      description: Production
  /account/{accountid}/phonenumbersubscription/{phnum}:
    put:
      summary: Update number settings
      description: '# Update number settings


        After a phone number has been subscribed, you can issue a PUT request in order to change its settings such as the destination it is connected to, the package that it is on (standard or business).


        ## Change Call forwarding


        Incoming calls to a phone number can be sent to various types of destinations such as a user, a voice app or your mobile number.


        The `connect_to_type` and `connect_to` properties together define the destination where the number is connected. The below table specifies how these two properties can be used.


        | Destination | connect_to_type | connect_to |

        |--------------|-----------------|------------|

        |a user|user| `UserId` of the user|

        |any mobile or landline number|phnum|the destination number in E164 format with ''+''. For example, +14015550000|

        |SIP URI|sip|\[sip:\]sip_uri@domain_or_ip\[:port\]|

        |a voice app|app|`{ “app_type” : “ivr”, “app_id” : "UNIQUE_APP_ID" }`|


        **Note**:

        1. To get the `userid` for all the users in your account, use `GET /account/{accountid}/user`.

        2. A list of all the voice apps in your account and their `app_id` can be fetched using `GET /account/{accountid}/voiceapp`


        > ### Connecting numbers to a voiceapp

        >

        > Only phone numbers that are free with website or paid plans can be connected to a voice app.

        > Plans can be enabled from app.sonetel.com'
      operationId: putaccount-accountid-phonenumbersubscription-phnum
      parameters:
      - name: Content-Type
        in: header
        description: application/json
        required: true
        schema:
          type: string
          default: application/json
      - name: Authorization
        in: header
        description: Bearer <ACCESS_TOKEN>
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      - name: phnum
        in: path
        description: Your phone number in the E164 format without the leading +.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                connect_to_type:
                  type: string
                  enum:
                  - user
                  - phnum
                  - sip
                  - app
                  description: The type of destination that the phone number is connected to for receiving incoming calls.
                  minLength: 1
                connect_to:
                  type: string
                  description: The object that the phone number is connected to. It can be a userId, a phone number or a SIP address.
                  minLength: 1
              required:
              - connect_to_type
              - connect_to
              x-examples:
                example-1:
                  connect_to_type: phnum
                  connect_to: '+919866241476'
                  show: caller
            examples:
              Example (user):
                value:
                  connect_to_type: user
                  connect_to: '200000000'
              Example (voicemail):
                value:
                  connect_to_type: app
                  connect_to: UNIQUE_APP_ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Single-phone-number-subscription'
      servers:
      - url: https://public-api.sonetel.com/
        description: Production
      tags:
      - Account
    get:
      summary: Get my number details
      description: '# Get my number details


        Send a GET request to the `/account/{accountid}/phonenumbersubscription/{phnum}` endpoint to see the details of a specific phone number assigned to your account.


        Here `{phnum}` represents a phone number assigned to your account in the E164 format without the leading plus sign. For example, if the phone number is *+1 (401) 555-0000*, the API call will be `/account/{accountid}/phonenumbersubscription/14015550000`


        The response carries the phone number resource with its properties such as the destination it is connected to, the next date on which the subscription fee is due and so on.'
      operationId: getaccount-accountid-phonenumbersubscription-phnum
      parameters:
      - name: Authorization
        in: header
        description: Bearer <ACCESS_TOKEN>
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      - name: phnum
        in: path
        description: Your phone number in the E164 format without the leading +.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Single-phone-number-subscription'
      servers:
      - url: https://public-api.sonetel.com/
        description: Production
      tags:
      - Account
    delete:
      summary: Return number
      description: '# Return number


        A phone number subscription can be removed from your account by issuing a DELETE request to the phone number subscription resource.


        Mention the phone number to delete in the request URI. Deleting a phone number subscription permanently removes it.


        > Please be careful when deleting subscriptions, it may not be possible to re-assign the phone number once it is removed from your account.


        Issuing a DELETE request to the phone number subscription immediately removes it from your Sonetel account. If you wish to return the number after the current subscription period ends, you can turn off the renewal instead.


        1. Sign in to your account from app.sonetel.com

        2. Go to the Phone numbers section.

        3. Click on the number you wish to return and change the renewal mode from *Subscription* to **Do not renew**'
      operationId: deleteaccount-accountid-phonenumbersubscription-phnum
      parameters:
      - name: Authorization
        in: header
        description: Bearer <ACCESS_TOKEN>
        required: true
        schema:
          type: string
      - name: accountid
        in: path
        description: Your Sonetel account ID
        required: true
        schema:
          type: string
      - name: phnum
        in: path
        description: Your phone number in the E164 format without the leading +.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                    description: Name of the resource that was accessed
                    minLength: 1
                  status:
                    type: string
                    enum:
                    - success
                    - failed
                    description: The status of the request i.e. success or failed.
                    minLength: 1
                    readOnly: true
                  response:
                    type: string
                    description: The response from the API.
                    minLength: 1
                x-examples:
                  example-1:
                    resource: phonenumbersubscription
                    status: success
                    response: Successfully removed subscription of phone number 14012233433 from account 206497932
              examples:
                Example:
                  value:
                    resource: phonenumbersubscription
                    status: success
                    response: Successfully removed subscription of phone number <PHONE_NUMBER> from account <ACCOUNT_ID>
      servers:
      - url: https://public-api.sonetel.com/
        description: Production
      tags:
      - Account
