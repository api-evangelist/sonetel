    Call-summary:
      type: object
      title: Call-summary
      description: Call summary generated by Sonetel AI
      properties:
        text_id:
          type: string
          description: 'The unique `text_id` of the call summary.

            The text_id can be used to retrieve details of the summary from the [Sonetel Text manager](reference/13_ai_textmanager.yaml)'
          readOnly: true
          examples:
          - 4hU4hy387
        file_id:
          type: string
          description: 'The unique `file_id` of the call recording in the [Sonetel file manager](reference/15_ai_filemanager.yaml)

            File_id is used by Sonetel AI services as a reference to the call recording for generating summaries.'
          readOnly: true
          examples:
          - bh3j8km63
        about:
          type: string
          description: A short Sonetel AI generated string that identifies what the call is about.
          readOnly: true
        score:
          type: number
          description: A score(1 to 5) assigned by Sonetel AI to the call recording based on an analysis of the call.
          format: float
          minimum: 0
          maximum: 5
          readOnly: true
          examples:
          - 4.2
        status:
          type: string
          enum:
          - not_requested
          - in_progress
          - ready
          - failed
          - retry
          description: 'The status of the call summary generation


            `not_requested`: The summary has not yet been not_requested


            `in_progress`: The summary generation is in progress


            `ready`: The summary is ready. The summary can be fetched using the `text_id` from the [text manager](reference/13_ai_textmanager.yaml)


            `failed`: The summary was requested and has failed. It is not possible to summarize this recording.


            `retry`: The summary was requested and failed. The summary can be requested again.'
          readOnly: true
        error_code:
          type: string
          description: An error code that identifies the last error during summary generation.
        error_date:
          type: string
          description: The date and time when the last error occured during summary generation
          format: date-time
