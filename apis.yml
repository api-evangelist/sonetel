aid: sonetel
name: Sonetel
description: Sonetel provides business phone numbers and communication services for entrepreneurs and small businesses, offering local phone numbers
  in 78 countries that ring in the Sonetel app for iPhone and Android or forward to any phone worldwide, with SMS on some number types, call recording,
  AI call summaries, call scoring and suggested follow-up emails. Sonetel publishes a developer API documented at docs.sonetel.com (Stoplight-hosted),
  with its API docs source maintained in the Sonetel GitHub organization.
